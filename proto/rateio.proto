syntax = "proto3";

package rateio;

option java_multiple_files = true;
option java_package = "com.sd.rateio.grpc";

// =====================================================================
//  Microsserviço 1 — Usuários & Grupos
// =====================================================================
service UserGroupService {
  // Registra um novo usuário com senha
  rpc RegisterUser (RegisterUserRequest) returns (RegisterUserResponse);

  // Autentica um usuário (verifica senha)
  rpc AuthenticateUser (AuthenticateUserRequest) returns (AuthenticateUserResponse);

  // Cria um novo grupo
  rpc CreateGroup (CreateGroupRequest) returns (CreateGroupResponse);

  // Lista todos os grupos existentes
  rpc ListGroups (ListGroupsRequest) returns (ListGroupsResponse);
}

// =====================================================================
//  Microsserviço 2 — Finanças (Despesas, Saldos, Liquidações)
// =====================================================================
service FinanceService {
  // Registra uma nova despesa no grupo
  rpc AddExpense (ExpenseRequest) returns (ExpenseResponse);

  // Consulta o saldo consolidado de um usuário
  rpc GetUserBalance (BalanceRequest) returns (BalanceResponse);

  // Registra pagamento de dívida entre dois usuários (settle up)
  rpc SettleDebt (SettleDebtRequest) returns (SettleDebtResponse);

  // Retorna o histórico/extrato de despesas de um grupo
  rpc GetGroupExpenses (GroupExpensesRequest) returns (GroupExpensesResponse);

  // Retorna as dívidas simplificadas par a par de um grupo
  rpc GetGroupBalances (GroupBalancesRequest) returns (GroupBalancesResponse);
}

// ===================== Auth =====================

message RegisterUserRequest {
  string user_id = 1;
  string name = 2;
  string password = 3;
}

message RegisterUserResponse {
  bool success = 1;
  string message = 2;
}

message AuthenticateUserRequest {
  string user_id = 1;
  string password = 2;
}

message AuthenticateUserResponse {
  bool success = 1;
  string message = 2;
  string user_id = 3;
  string name = 4;
}

// ===================== Group Management =====================

message CreateGroupRequest {
  string group_id = 1;
  string group_name = 2;
  repeated string member_user_ids = 3;
}

message CreateGroupResponse {
  bool success = 1;
  string message = 2;
}

message ListGroupsRequest {}

message ListGroupsResponse {
  repeated GroupInfo groups = 1;
}

message GroupInfo {
  string group_id = 1;
  string group_name = 2;
  repeated string member_user_ids = 3;
}

// ===================== Expense =====================

message ExpenseRequest {
  string group_id = 1;
  string paid_by_user_id = 2;
  double amount = 3;
  repeated string participant_user_ids = 4;
  string description = 5;
}

message ExpenseResponse {
  bool success = 1;
  string message = 2;
  string transaction_id = 3;
}

// ===================== User Balance =====================

message BalanceRequest {
  string group_id = 1;
  string user_id = 2;
}

message BalanceResponse {
  string user_id = 1;
  double total_balance = 2;
  string currency = 3;
}

// ===================== Settle Debt =====================

message SettleDebtRequest {
  string group_id = 1;
  string from_user_id = 2;
  string to_user_id = 3;
  double amount = 4;
}

message SettleDebtResponse {
  bool success = 1;
  string message = 2;
}

// ===================== Group Expenses (Histórico) =====================

message GroupExpensesRequest {
  string group_id = 1;
}

message GroupExpensesResponse {
  repeated ExpenseRecord expenses = 1;
}

message ExpenseRecord {
  string transaction_id = 1;
  string group_id = 2;
  string paid_by_user_id = 3;
  double amount = 4;
  repeated string participant_user_ids = 5;
  string description = 6;
  string timestamp = 7;
  double share_per_person = 8;
}

// ===================== Group Balances (Quem deve para quem) =====================

message GroupBalancesRequest {
  string group_id = 1;
}

message GroupBalancesResponse {
  string group_id = 1;
  repeated DebtEntry debts = 2;
}

message DebtEntry {
  string from_user_id = 1;
  string to_user_id = 2;
  double amount = 3;
}
