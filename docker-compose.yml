version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rateio-postgres
    environment:
      POSTGRES_USER: rateio
      POSTGRES_PASSWORD: rateio123
      POSTGRES_DB: rateio_users
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rateio"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:

